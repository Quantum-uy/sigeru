version: "3.8"

services:

  db:
    image: mysql:8.0
    container_name: sigeru-db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: sigeru
    volumes:
      - ./base-de-datos/dump_estructura_sigeru.sql:/docker-entrypoint-initdb.d/01-estructura.sql
      - ./base-de-datos/sigeru.sql:/docker-entrypoint-initdb.d/02-datos.sql
      - db_data:/var/lib/mysql
    ports:
      - "3307:3306"

  api-usuarios:
    build:
      context: .
      dockerfile: api-usuarios/Dockerfile
    container_name: sigeru-api-usuarios
    restart: unless-stopped
    environment:
      DB_HOST: db
      DB_USER: root
      DB_PASS: root
      DB_NAME: sigeru
    volumes:
      - php_sessions:/var/lib/php/sessions
    ports:
      - "8001:80"
    depends_on:
      - db

  api-camiones:
    build:
      context: .
      dockerfile: api-camiones/Dockerfile
    container_name: sigeru-api-camiones
    restart: unless-stopped
    environment:
      DB_HOST: db
      DB_USER: root
      DB_PASS: root
      DB_NAME: sigeru
    volumes:
      - php_sessions:/var/lib/php/sessions
    ports:
      - "8002:80"
    depends_on:
      - db

  api-gestion:
    build:
      context: .
      dockerfile: api-gestion/Dockerfile
    container_name: sigeru-api-gestion
    restart: unless-stopped
    environment:
      DB_HOST: db
      DB_USER: root
      DB_PASS: root
      DB_NAME: sigeru
    volumes:
      - php_sessions:/var/lib/php/sessions
    ports:
      - "8003:80"
    depends_on:
      - db

  api-recoleccion:
    build:
      context: .
      dockerfile: api-recoleccion/Dockerfile
    container_name: sigeru-api-recoleccion
    restart: unless-stopped
    environment:
      DB_HOST: db
      DB_USER: root
      DB_PASS: root
      DB_NAME: sigeru
    volumes:
      - php_sessions:/var/lib/php/sessions
    ports:
      - "8004:80"
    depends_on:
      - db

  frontend:
    build: ./frontend-backoffice
    container_name: sigeru-frontend
    restart: unless-stopped
    ports:
      - "8080:80"

  landing:
    build: ./landing-page
    container_name: sigeru-landing
    restart: unless-stopped
    ports:
      - "8000:80"

volumes:
  db_data:
  php_sessions:
